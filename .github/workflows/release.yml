# One click, one tag, one release.
#
# Bump [workspace.package].version in Cargo.toml, push the default branch, then use
# Actions → release → Run workflow. GitHub freezes that commit, builds, signs, verifies,
# creates daemon-v<version>, uploads the assets, and publishes the release.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daemon-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Derive release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          expected_ref = f"refs/heads/{os.environ['DEFAULT_BRANCH']}"
          if os.environ["DISPATCH_REF"] != expected_ref:
              raise SystemExit(
                  "run releases from the default branch: "
                  f"expected {expected_ref}, got {os.environ['DISPATCH_REF']}"
              )

          source_sha = subprocess.run(
              ["git", "rev-parse", "--verify", "HEAD^{commit}"],
              check=True,
              text=True,
              stdout=subprocess.PIPE,
          ).stdout.strip()
          if source_sha != os.environ["DISPATCH_SHA"]:
              raise SystemExit(
                  f"checked-out source {source_sha} differs from dispatch {os.environ['DISPATCH_SHA']}"
              )

          with open("Cargo.toml", "rb") as stream:
              version = tomllib.load(stream)["workspace"]["package"]["version"]
          stable_semver = r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)"
          if not isinstance(version, str) or re.fullmatch(stable_semver, version) is None:
              raise SystemExit(f"workspace version must be stable SemVer X.Y.Z, got {version!r}")

          outputs = Path(os.environ["GITHUB_OUTPUT"])
          with outputs.open("a", encoding="utf-8") as stream:
              stream.write(f"source_sha={source_sha}\n")
              stream.write(f"tag=daemon-v{version}\n")
              stream.write(f"version={version}\n")
          PY

      - name: Refuse an existing release version
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -eu

          # A failed publish may leave a draft or its tag. They are resumable only when they point
          # at this exact source; a published version is immutable.
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            tag_sha="$(git rev-parse "$TAG^{commit}")"
            if [ "$tag_sha" != "$SOURCE_SHA" ]; then
              echo "::error::$TAG points at $tag_sha, not selected commit $SOURCE_SHA"
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            state="$(gh release view "$TAG" --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv')"
            is_draft="$(printf '%s' "$state" | cut -f1)"
            release_target="$(printf '%s' "$state" | cut -f2)"
            if [ "$is_draft" != true ] || [ "$release_target" != "$SOURCE_SHA" ]; then
              echo "::error::$TAG already exists; bump [workspace.package].version"
              exit 1
            fi
          fi

          echo "$TAG from $SOURCE_SHA: build → sign → verify → publish" \
            >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build, verify, and publish
    needs: prepare
    uses: ./.github/workflows/_build-release.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit
