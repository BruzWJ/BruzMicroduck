[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Build tooling for packaging robot releases"

# Deliberately a separate crate, not a subcommand of `updater`: this never ships to a
# robot.
[dependencies]
clap = { version = "4", features = ["derive", "env"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tar = "0.4"
toml = "1"
zstd = "0.13"
# The boards a release supports, for its manifest's `min_hw_rev`: `board::min_hw_rev` reads
# each board's last release from the source being packaged.
robotd-params = { path = "../robotd-params" }

# Only `tests/artifact.rs`, which packages into a scratch directory. `tar`, `zstd` and `toml`
# come from the dependencies above: Cargo links those into test targets too.
[dev-dependencies]
tempfile = "3.27.0"
