[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Build tooling for packaging robot releases"

# Deliberately a separate crate, not a subcommand of `updater`: this never ships to a
# robot.
[dependencies]
clap = { version = "4", features = ["derive", "env"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tar = "0.4"
toml = "1"
zstd = "0.13"

# Only `tests/artifact.rs`, which packages into a scratch directory. `tar`, `zstd` and `toml`
# come from the dependencies above: Cargo links those into test targets too.
[dev-dependencies]
tempfile = "3.27.0"
# So `the_download_list_is_exactly_what_robotd_defaults_to` can derive the list from the
# daemon's own defaults rather than from a second copy of it. Pure serde + toml, and only a
# dev-dependency: the packaging tool itself has no business knowing about policy slots.
robotd-params = { path = "../robotd-params" }
