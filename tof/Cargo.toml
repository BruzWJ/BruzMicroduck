# The head sensors: an 8x8 depth matrix from a VL53L5CX, the optional head
# LSM6DSV16X stream, and the daemon that serves both.
#
# The driver is ST's Ultra Lite Driver (vendored C, BSD-3-Clause) behind a flat
# shim and a safe Rust wrapper — see src/lib.rs for why the C is vendored rather
# than reimplemented or depended on. `tofd` owns both head-device addresses and
# publishes their frames; Linux serialises them with the body IMU on the shared
# Qwiic adapter.
[package]
name = "tof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "tof"

[[bin]]
name = "tofd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { workspace = true, features = ["derive"] }
duck-ipc-proto = { path = "../duck-ipc-proto" }
# `[head_imu]` lives in `robotd.toml`, and this crate is the schema for that file — the same
# dependency, for the same reason, that `mediad` takes on for `[media]`. See `src/config.rs`.
robotd-params = { path = "../robotd-params" }
qwiic-imu = { path = "../qwiic-imu" }
libc = "0.2"
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time", "io-util"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3.27.0"
